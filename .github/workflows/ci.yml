name: CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Go) checks
    runs-on: ubuntu-latest
    
    # PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Gofmt check
        run: |
          set -e
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
        env:
          POSTGRES_TEST_DSN: "host=localhost user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"

  frontend:
    name: Frontend (BusinessRulesClient) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BusinessRulesClient
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (if present)
        run: npm run build --if-present
